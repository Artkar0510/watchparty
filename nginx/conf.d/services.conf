server {
    listen 80 default_server;
    server_name _;

    # Frontend SPA — index at /, assets at /static-front/
    root /var/www/frontend;

    location = / {
        try_files /index.html =404;
    }

    location /static-front/ {
        alias /var/www/frontend/;
        expires 1h;
        add_header Cache-Control "public, no-cache";
    }

    # Локальные видеофайлы для FilmWork.video_url вида "/videos/foo.mp4".
    # nginx сам отдаёт Accept-Ranges: bytes для статики, так что seek работает.
    location /videos/ {
        alias /var/www/frontend/videos/;
        expires 1h;
        add_header Cache-Control "public, no-cache";
    }

    # Auth Service
    location /api/v1/auth {
        proxy_pass http://auth-service:8000;
    }

    location /api/v1/users {
        proxy_pass http://auth-service:8000;
    }

    # Content Service
    location /api/v1/films {
        proxy_pass http://content-service:8000;
    }

    location /api/v1/genres {
        proxy_pass http://content-service:8000;
    }

    location /api/v1/watchlist {
        proxy_pass http://content-service:8000;
    }

    location /api/v1/matches {
        proxy_pass http://content-service:8000;
    }

    # Together Service (REST + WebSocket)
    location /api/v1/sessions {
        proxy_pass http://together-service:8000;
    }

    location /ws/ {
        proxy_pass http://together-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # UGC Service
    location /api/v1/likes {
        proxy_pass http://ugc-service:8000;
    }

    location /api/v1/bookmarks {
        proxy_pass http://ugc-service:8000;
    }

    location /api/v1/reviews {
        proxy_pass http://ugc-service:8000;
    }

    # Notification Service
    location /api/v1/notifications {
        proxy_pass http://notification-service:8000;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://admin-service:8000/admin/;
    }

    location /static/ {
        alias /var/www/static/;
        expires 90d;
        log_not_found off;
    }

    # Health checks
    location /health/auth {
        proxy_pass http://auth-service:8000/health;
    }

    location /health/content {
        proxy_pass http://content-service:8000/health;
    }

    location /health/together {
        proxy_pass http://together-service:8000/health;
    }

    location /health/ugc {
        proxy_pass http://ugc-service:8000/health;
    }

    location /health/notification {
        proxy_pass http://notification-service:8000/health;
    }
}
