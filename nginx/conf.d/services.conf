server {
    listen 80 default_server;
    server_name _;

    # Auth Service
    location /api/v1/auth/ {
        proxy_pass http://auth-service:8000/api/v1/auth/;
    }

    location /api/v1/users/ {
        proxy_pass http://auth-service:8000/api/v1/users/;
    }

    # Content Service
    location /api/v1/films/ {
        proxy_pass http://content-service:8000/api/v1/films/;
    }

    location /api/v1/genres/ {
        proxy_pass http://content-service:8000/api/v1/genres/;
    }

    location /api/v1/watchlist/ {
        proxy_pass http://content-service:8000/api/v1/watchlist/;
    }

    location /api/v1/matches/ {
        proxy_pass http://content-service:8000/api/v1/matches/;
    }

    # Together Service (REST + WebSocket)
    location /api/v1/sessions/ {
        proxy_pass http://together-service:8000/api/v1/sessions/;
    }

    location /ws/ {
        proxy_pass http://together-service:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # UGC Service
    location /api/v1/likes/ {
        proxy_pass http://ugc-service:8000/api/v1/likes/;
    }

    location /api/v1/bookmarks/ {
        proxy_pass http://ugc-service:8000/api/v1/bookmarks/;
    }

    location /api/v1/reviews/ {
        proxy_pass http://ugc-service:8000/api/v1/reviews/;
    }

    # Notification Service
    location /api/v1/notifications/ {
        proxy_pass http://notification-service:8000/api/v1/notifications/;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://admin-service:8000/admin/;
    }

    location /static/ {
        alias /var/www/static/;
        expires 90d;
        log_not_found off;
    }

    # Health checks
    location /health/auth {
        proxy_pass http://auth-service:8000/health;
    }

    location /health/content {
        proxy_pass http://content-service:8000/health;
    }

    location /health/together {
        proxy_pass http://together-service:8000/health;
    }

    location /health/ugc {
        proxy_pass http://ugc-service:8000/health;
    }

    location /health/notification {
        proxy_pass http://notification-service:8000/health;
    }
}
